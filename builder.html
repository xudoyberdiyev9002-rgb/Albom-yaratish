<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shablon Yaratuvchi – VinyetkaLab</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;scroll-behavior:smooth}
    body{font-family:'Inter',sans-serif;background:#0f0f17;color:#e2e2f0;display:flex;height:100vh;overflow:hidden}

    /* ── SIDEBAR ── */
    .sidebar{width:320px;min-width:280px;background:#13131f;border-right:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;overflow:hidden}
    .sidebar-header{padding:16px 18px 12px;border-bottom:1px solid rgba(255,255,255,0.07);flex-shrink:0}
    .sidebar-header a{font-size:12px;color:#6060a0;text-decoration:none;display:inline-flex;align-items:center;gap:5px;margin-bottom:8px;transition:color .2s}
    .sidebar-header a:hover{color:#a5b4fc}
    .sidebar-header h2{font-size:16px;font-weight:700;color:#fff}
    .sidebar-header p{font-size:11px;color:#6060a0;margin-top:2px}

    .sidebar-body{flex:1;overflow-y:auto;padding:14px}
    .sidebar-body::-webkit-scrollbar{width:4px}
    .sidebar-body::-webkit-scrollbar-thumb{background:#2a2a40;border-radius:2px}

    /* ── SECTION ── */
    .sec{margin-bottom:16px}
    .sec-title{font-size:10px;font-weight:700;color:#6060a0;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
    .sec-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.06)}

    /* ── CONTROLS ── */
    .ctrl{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
    .ctrl:last-child{margin-bottom:0}
    .ctrl label{font-size:11px;color:#8080a0;font-weight:500;display:flex;justify-content:space-between;align-items:center}
    .ctrl label span{color:#6366f1;font-weight:700;font-size:11px}
    .ctrl input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:rgba(255,255,255,0.1);border-radius:2px;outline:none;cursor:pointer}
    .ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#6366f1;cursor:pointer}
    .ctrl input[type=number],.ctrl input[type=text],.ctrl select{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:7px;padding:7px 10px;color:#e2e2f0;font-size:12px;width:100%;transition:border-color .2s}
    .ctrl input:focus,.ctrl select:focus{outline:none;border-color:#6366f1}
    .ctrl select option{background:#1a1a2e}
    .ctrl input[type=color]{width:100%;height:32px;border:1px solid rgba(255,255,255,0.1);border-radius:7px;background:rgba(255,255,255,0.06);cursor:pointer;padding:2px 4px}

    .ctrl-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}
    .ctrl-row .ctrl{margin-bottom:0}

    /* ── TOGGLE GROUP ── */
    .toggle-group{display:flex;gap:3px;flex-wrap:wrap}
    .toggle-btn{flex:1;min-width:52px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#8080a0;padding:6px 4px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
    .toggle-btn:hover{border-color:rgba(99,102,241,0.4);color:#a5b4fc}
    .toggle-btn.active{background:rgba(99,102,241,0.15);border-color:#6366f1;color:#a5b4fc}

    /* ── FON RASM UPLOAD ── */
    .bg-upload-zone{border:2px dashed rgba(99,102,241,0.3);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all .3s;background:rgba(99,102,241,0.04);position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:70px}
    .bg-upload-zone:hover{border-color:#6366f1;background:rgba(99,102,241,0.1)}
    .bg-upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
    .bg-upload-zone .buz-icon{font-size:24px;flex-shrink:0}
    .bg-upload-zone p{font-size:12px;color:#8080a0;margin:0;text-align:left}
    .bg-upload-zone small{font-size:10px;color:#4040a0;display:block}
    .bg-preview-wrap{margin-top:7px;position:relative;display:none}
    .bg-preview{width:100%;height:72px;border-radius:8px;object-fit:cover;border:1px solid rgba(255,255,255,0.1);display:block}
    .bg-remove-btn{position:absolute;top:4px;right:4px;background:rgba(248,113,113,0.85);border:none;color:#fff;width:22px;height:22px;border-radius:50%;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}

    /* ── BUTTONS ── */
    .btn-apply{width:100%;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff;border:none;padding:11px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .3s;margin-top:4px;box-shadow:0 4px 14px rgba(99,102,241,0.3)}
    .btn-apply:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,0.45)}
    .btn-download{width:100%;background:linear-gradient(135deg,#059669,#10b981);color:#fff;border:none;padding:10px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;transition:all .3s;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:7px}
    .btn-download:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,185,129,0.4)}

    /* ── CANVAS AREA ── */
    .canvas-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .canvas-toolbar{padding:10px 18px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:10px;flex-shrink:0;background:#0f0f17}
    .canvas-info{font-size:12px;color:#6060a0}
    .zoom-btns{display:flex;gap:3px;margin-left:auto}
    .zoom-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#a0a0c0;width:30px;height:30px;border-radius:7px;font-size:13px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
    .zoom-btn:hover{background:rgba(99,102,241,0.15);color:#a5b4fc}
    .zoom-label{font-size:12px;color:#6060a0;min-width:44px;text-align:center}

    .canvas-scroll{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:28px;
      background:repeating-conic-gradient(#1a1a2a 0% 25%,#161622 0% 50%) 0 0/28px 28px}
    #mainCanvas{border-radius:3px;box-shadow:0 8px 48px rgba(0,0,0,0.75);display:block;cursor:crosshair}

    @media(max-width:700px){
      body{flex-direction:column}
      .sidebar{width:100%;height:auto;min-width:unset;border-right:none;border-bottom:1px solid rgba(255,255,255,0.07)}
      .sidebar-body{max-height:45vh}
      .canvas-scroll{padding:14px}
    }
  </style>
</head>
<body>

<!-- ══════════ SIDEBAR ══════════ -->
<div class="sidebar">
  <div class="sidebar-header">
    <a href="index.html">← Asosiy sahifa</a>
    <h2>🎨 Shablon Yaratuvchi</h2>
    <p>Real-time albom sahifasi dizayneri</p>
  </div>

  <div class="sidebar-body">

    <!-- 1. O'LCHAM -->
    <div class="sec">
      <div class="sec-title">📐 Sahifa O'lchami</div>
      <div class="ctrl">
        <label>Tezkor o'lchamlar</label>
        <div class="toggle-group" id="presetSizes">
          <button class="toggle-btn active" data-w="1200" data-h="900">30×40</button>
          <button class="toggle-btn" data-w="900"  data-h="1200">A4 Port</button>
          <button class="toggle-btn" data-w="1240" data-h="1748">A4 To'liq</button>
          <button class="toggle-btn" data-w="800"  data-h="600">4:3</button>
        </div>
      </div>
      <div class="ctrl-row">
        <div class="ctrl">
          <label>Kenglik (px)</label>
          <input type="number" id="canvasW" value="1200" min="400" max="4800" step="10"/>
        </div>
        <div class="ctrl">
          <label>Balandlik (px)</label>
          <input type="number" id="canvasH" value="900" min="300" max="4800" step="10"/>
        </div>
      </div>
    </div>

    <!-- 2. ORQA FON -->
    <div class="sec">
      <div class="sec-title">🖼 Orqa Fon</div>
      <div class="ctrl">
        <label>Fon turi</label>
        <div class="toggle-group" id="bgTypeGroup">
          <button class="toggle-btn active" data-val="color">Rang</button>
          <button class="toggle-btn" data-val="gradient">Gradient</button>
          <button class="toggle-btn" data-val="image">Rasm</button>
        </div>
      </div>

      <!-- Rang / Gradient panel -->
      <div id="bgColorPanel">
        <div class="ctrl-row">
          <div class="ctrl">
            <label>Asosiy rang</label>
            <input type="color" id="bgColor1" value="#1a237e"/>
          </div>
          <div class="ctrl" id="bgColor2Wrap" style="display:none">
            <label>2-rang</label>
            <input type="color" id="bgColor2" value="#7c3aed"/>
          </div>
        </div>
        <div class="ctrl" id="gradDirWrap" style="display:none">
          <label>Yo'nalish</label>
          <select id="gradDirection">
            <option value="tb">Yuqoridan pastga ↓</option>
            <option value="lr">Chapdan o'ngga →</option>
            <option value="diag">Diagonal ↗</option>
            <option value="radial">Radial ◎</option>
          </select>
        </div>
      </div>

      <!-- Rasm panel -->
      <div id="bgImagePanel" style="display:none">
        <div class="bg-upload-zone" id="bgUploadZone">
          <input type="file" id="bgFileInput" accept="image/*"/>
          <span class="buz-icon">🖼</span>
          <div>
            <p>Fon rasmini yuklang</p>
            <small>JPG · PNG · WEBP</small>
          </div>
        </div>
        <div class="bg-preview-wrap" id="bgPreviewWrap">
          <img id="bgPreviewImg" class="bg-preview" alt="fon"/>
          <button id="bgRemoveBtn" class="bg-remove-btn" title="O'chirish">✕</button>
        </div>
        <div class="ctrl" style="margin-top:8px">
          <label>Qoplaydigan qoralashtirish <span id="bgOverlayVal">40%</span></label>
          <input type="range" id="bgOverlay" min="0" max="95" value="40"/>
        </div>
        <div class="ctrl">
          <label>Overlay rangi</label>
          <input type="color" id="bgOverlayColor" value="#000000"/>
        </div>
      </div>
    </div>

    <!-- 3. O'QUVCHILAR -->
    <div class="sec">
      <div class="sec-title">👨‍🎓 O'quvchilar Grid</div>
      <div class="ctrl">
        <label>O'quvchilar soni <span id="studentCountVal">20</span></label>
        <input type="range" id="studentCount" min="1" max="60" value="20"/>
      </div>
      <div class="ctrl-row">
        <div class="ctrl">
          <label>Ustunlar <span id="colsVal">5</span></label>
          <input type="range" id="cols" min="2" max="10" value="5"/>
        </div>
        <div class="ctrl">
          <label>Rasm shakli</label>
          <select id="photoShape">
            <option value="rounded">Yumaloq</option>
            <option value="circle">Doira</option>
            <option value="rect">To'rtburchak</option>
            <option value="oval">Oval</option>
          </select>
        </div>
      </div>
      <div class="ctrl-row">
        <div class="ctrl">
          <label>Gorizontal gap <span id="gapXVal">10</span></label>
          <input type="range" id="gapX" min="0" max="50" value="10"/>
        </div>
        <div class="ctrl">
          <label>Vertikal gap <span id="gapYVal">18</span></label>
          <input type="range" id="gapY" min="0" max="70" value="18"/>
        </div>
      </div>
      <div class="ctrl-row">
        <div class="ctrl">
          <label>Tepadan masofa <span id="gridTopVal">120</span></label>
          <input type="range" id="gridTop" min="20" max="500" value="120"/>
        </div>
        <div class="ctrl">
          <label>Pastdan masofa <span id="gridBotVal">60</span></label>
          <input type="range" id="gridBot" min="10" max="300" value="60"/>
        </div>
      </div>
    </div>

    <!-- 4. RASM -->
    <div class="sec">
      <div class="sec-title">📷 Rasm Sozlamalari</div>
      <div class="ctrl">
        <label>Rasm kattaligi <span id="photoScaleVal">100%</span></label>
        <input type="range" id="photoScale" min="30" max="130" value="100"/>
      </div>
      <div class="ctrl-row">
        <div class="ctrl">
          <label>Ramka qalinligi <span id="borderWVal">2</span>px</label>
          <input type="range" id="borderW" min="0" max="10" value="2"/>
        </div>
        <div class="ctrl">
          <label>Ramka rangi</label>
          <input type="color" id="borderColor" value="#ffffff"/>
        </div>
      </div>
    </div>

    <!-- 5. ISM JOYLASHUVI -->
    <div class="sec">
      <div class="sec-title">🔤 Ism Joylashuvi</div>
      <div class="ctrl">
        <label>Joylashuv</label>
        <div class="toggle-group" id="namePosGroup">
          <button class="toggle-btn active" data-val="bottom">Pastda</button>
          <button class="toggle-btn" data-val="top">Ustida</button>
          <button class="toggle-btn" data-val="over">Ustiga</button>
          <button class="toggle-btn" data-val="none">Yo'q</button>
        </div>
      </div>
      <div class="ctrl-row">
        <div class="ctrl">
          <label>Shrift hajmi <span id="nameFSVal">13</span>px</label>
          <input type="range" id="nameFS" min="7" max="40" value="13"/>
        </div>
        <div class="ctrl">
          <label>Ism rangi</label>
          <input type="color" id="nameColor" value="#ffffff"/>
        </div>
      </div>
      <div class="ctrl-row">
        <div class="ctrl">
          <label>Tekislash</label>
          <div class="toggle-group" id="nameAlignGroup">
            <button class="toggle-btn active" data-val="center">↔</button>
            <button class="toggle-btn" data-val="left">←</button>
            <button class="toggle-btn" data-val="right">→</button>
          </div>
        </div>
        <div class="ctrl">
          <label>Qalinlik</label>
          <div class="toggle-group" id="nameWeightGroup">
            <button class="toggle-btn" data-val="300">Yengil</button>
            <button class="toggle-btn active" data-val="500">O'rta</button>
            <button class="toggle-btn" data-val="700">Qalin</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 6. HEADER -->
    <div class="sec">
      <div class="sec-title">📌 Sarlavha (Header)</div>
      <div class="ctrl">
        <label>Ko'rinish</label>
        <div class="toggle-group" id="headerStyleGroup">
          <button class="toggle-btn active" data-val="band">Band</button>
          <button class="toggle-btn" data-val="text">Matn</button>
          <button class="toggle-btn" data-val="none">Yo'q</button>
        </div>
      </div>
      <div id="headerPanel">
        <div class="ctrl-row">
          <div class="ctrl">
            <label>Balandligi <span id="headerHVal">60</span></label>
            <input type="range" id="headerH" min="0" max="180" value="60"/>
          </div>
          <div class="ctrl">
            <label>Band rangi</label>
            <input type="color" id="headerColor" value="#3730a3"/>
          </div>
        </div>
        <div class="ctrl">
          <label>Matn</label>
          <input type="text" id="headerText" placeholder="Maktab №64 · 9-A sinf · 2025-2026"/>
        </div>
        <div class="ctrl-row">
          <div class="ctrl">
            <label>Matn hajmi <span id="headerFSVal">14</span></label>
            <input type="range" id="headerFS" min="8" max="48" value="14"/>
          </div>
          <div class="ctrl">
            <label>Matn rangi</label>
            <input type="color" id="headerTextColor" value="#ffffff"/>
          </div>
        </div>
      </div>
    </div>

    <!-- TUGMALAR -->
    <button class="btn-apply" id="applyBtn">🔄 Yangilash</button>
    <button class="btn-download" id="downloadBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      PNG yuklab olish
    </button>
  </div><!-- /sidebar-body -->
</div><!-- /sidebar -->

<!-- ══════════ CANVAS AREA ══════════ -->
<div class="canvas-area">
  <div class="canvas-toolbar">
    <span class="canvas-info" id="canvasInfo">1200 × 900 px</span>
    <span class="canvas-info" id="studentInfo" style="margin-left:8px"></span>
    <div class="zoom-btns">
      <button class="zoom-btn" id="zoomOut" title="Kichraytirish">−</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="zoom-btn" id="zoomIn" title="Kattalashtirish">+</button>
      <button class="zoom-btn" id="zoomFit" title="Ekranga sig'dirish" style="font-size:11px;width:auto;padding:0 8px">Sig'dir</button>
      <button class="zoom-btn" id="zoom100" title="Haqiqiy o'lcham" style="font-size:11px;width:auto;padding:0 8px">1:1</button>
    </div>
  </div>
  <div class="canvas-scroll" id="canvasScroll">
    <canvas id="mainCanvas"></canvas>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const S = {
  // Canvas
  canvasW: 1200, canvasH: 900,
  // Fon
  bgType: 'color', bgColor1: '#1a237e', bgColor2: '#7c3aed',
  gradDirection: 'tb',
  bgImage: null, bgOverlay: 0.4, bgOverlayColor: '#000000',
  // Grid
  studentCount: 20, cols: 5,
  gapX: 10, gapY: 18,
  gridTop: 120, gridBot: 60,
  // Foto
  photoScale: 1.0, photoShape: 'rounded',
  borderW: 2, borderColor: '#ffffff',
  // Ism
  namePos: 'bottom', nameFS: 13, nameColor: '#ffffff',
  nameAlign: 'center', nameWeight: '500',
  // Header
  headerStyle: 'band', headerH: 60, headerColor: '#3730a3',
  headerText: '', headerFS: 14, headerTextColor: '#ffffff',
  // Zoom
  zoom: 1,
};

// ═══════════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('mainCanvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = S.canvasW;
  canvas.height = S.canvasH;
  document.getElementById('canvasInfo').textContent = `${S.canvasW} × ${S.canvasH} px`;
}

function setZoom(z) {
  S.zoom = Math.max(0.05, Math.min(4, z));
  canvas.style.width  = S.canvasW * S.zoom + 'px';
  canvas.style.height = S.canvasH * S.zoom + 'px';
  document.getElementById('zoomLabel').textContent = Math.round(S.zoom * 100) + '%';
}

function fitZoom() {
  const sc = document.getElementById('canvasScroll');
  const z  = Math.min((sc.clientWidth - 56) / S.canvasW, (sc.clientHeight - 56) / S.canvasH, 1);
  setZoom(Math.max(0.05, z));
}

// ═══════════════════════════════════════════════════════════
// CHIZISH
// ═══════════════════════════════════════════════════════════
function draw() {
  const W = S.canvasW, H = S.canvasH;
  ctx.clearRect(0, 0, W, H);

  // ─ 1. FON ──────────────────────────────────────────────
  if (S.bgType === 'image' && S.bgImage) {
    const iw = S.bgImage.naturalWidth, ih = S.bgImage.naturalHeight;
    const sc = Math.max(W / iw, H / ih);
    ctx.drawImage(S.bgImage, (W - iw * sc) / 2, (H - ih * sc) / 2, iw * sc, ih * sc);
    if (S.bgOverlay > 0.01) {
      ctx.fillStyle = hexRgba(S.bgOverlayColor, S.bgOverlay);
      ctx.fillRect(0, 0, W, H);
    }
  } else if (S.bgType === 'gradient') {
    let g;
    if (S.gradDirection === 'radial') {
      g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.75);
    } else if (S.gradDirection === 'lr') {
      g = ctx.createLinearGradient(0, 0, W, 0);
    } else if (S.gradDirection === 'diag') {
      g = ctx.createLinearGradient(0, 0, W, H);
    } else {
      g = ctx.createLinearGradient(0, 0, 0, H);
    }
    g.addColorStop(0, S.bgColor1);
    g.addColorStop(1, S.bgColor2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = S.bgColor1;
    ctx.fillRect(0, 0, W, H);
  }

  // ─ 2. HEADER ────────────────────────────────────────────
  let contentTop = 0;
  if (S.headerStyle !== 'none' && S.headerH > 0) {
    contentTop = S.headerH;
    if (S.headerStyle === 'band') {
      ctx.fillStyle = S.headerColor;
      ctx.fillRect(0, 0, W, S.headerH);
    } else {
      // matn uslubi – faqat ajratgich chiziq
      ctx.strokeStyle = hexRgba(S.headerColor, 0.6);
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, S.headerH); ctx.lineTo(W, S.headerH); ctx.stroke();
    }
    const htxt = S.headerText.trim();
    if (htxt) {
      ctx.save();
      ctx.fillStyle    = S.headerTextColor;
      ctx.font         = `600 ${S.headerFS}px Inter, sans-serif`;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(htxt, W / 2, S.headerH / 2);
      ctx.restore();
    }
  }

  // ─ 3. GRID HISOBLASH ────────────────────────────────────
  const gridTop    = contentTop + S.gridTop;
  const gridBottom = H - S.gridBot;
  const gridH      = Math.max(10, gridBottom - gridTop);
  const cols       = Math.max(1, S.cols);
  const count      = S.studentCount;
  const rows       = Math.ceil(count / cols);

  const cellW = Math.floor((W - S.gapX * (cols - 1)) / cols);
  const cellH = rows > 0 ? Math.floor((gridH - S.gapY * (rows - 1)) / rows) : 60;

  // Foto o'lchami
  const nameReserve = S.namePos === 'none' || S.namePos === 'over' ? 0 : S.nameFS * 2.6;
  const rawPhotoH   = Math.max(10, cellH - nameReserve);
  const photoH      = Math.round(rawPhotoH * S.photoScale);
  const photoW      = Math.round(photoH * 0.76); // 3:4

  document.getElementById('studentInfo').textContent =
    `${count} o'quvchi · ${cols}×${rows} grid · ${cellW}×${cellH} px katak`;

  // ─ 4. KATAKCHALAR ───────────────────────────────────────
  for (let i = 0; i < count; i++) {
    const col  = i % cols;
    const row  = Math.floor(i / cols);
    const cx   = col * (cellW + S.gapX) + cellW / 2;
    const cy   = gridTop + row * (cellH + S.gapY);

    // Foto Y pozitsiyasi
    const photoY = S.namePos === 'top' ? cy + S.nameFS * 2.2 : cy;
    const nameX  = S.nameAlign === 'left'  ? cx - photoW / 2 :
                   S.nameAlign === 'right' ? cx + photoW / 2 : cx;

    // ── Foto ──
    drawMockPhoto(cx, photoY, photoW, photoH, i, S.photoShape, S.borderW, S.borderColor);

    // ── Ism ──
    if (S.namePos !== 'none') {
      const label = NAMES[i % NAMES.length];
      ctx.save();
      ctx.fillStyle    = S.nameColor;
      ctx.font         = `${S.nameWeight} ${S.nameFS}px Inter, sans-serif`;
      ctx.textAlign    = S.nameAlign;
      ctx.textBaseline = 'top';

      switch(S.namePos) {
        case 'bottom':
          ctx.fillText(label, nameX, photoY + photoH + Math.round(photoH * 0.04) + 2);
          break;
        case 'top':
          ctx.textBaseline = 'bottom';
          ctx.fillText(label, nameX, photoY - 3);
          break;
        case 'over': {
          // Gradient overlay + oq matn
          const oH = Math.round(photoH * 0.30);
          const oY = photoY + photoH - oH;
          ctx.save();
          ctx.beginPath();
          drawPhotoClip(cx, photoY, photoW, photoH, S.photoShape);
          ctx.clip();
          const og = ctx.createLinearGradient(0, oY, 0, photoY + photoH);
          og.addColorStop(0, 'rgba(0,0,0,0)');
          og.addColorStop(1, 'rgba(0,0,0,0.75)');
          ctx.fillStyle = og;
          ctx.fillRect(cx - photoW/2, oY, photoW, oH);
          ctx.restore();
          ctx.fillStyle    = '#ffffff';
          ctx.textAlign    = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(label, cx, photoY + photoH - 4);
          break;
        }
      }
      ctx.restore();
    }
  }
}

// ─ MOCK FOTO ──────────────────────────────────────────────
const PALETTE = [
  ['#1e3a5f','#2d6a4f'],['#4a1942','#6b2d5e'],['#1a3a5c','#1e6091'],
  ['#3d1a00','#7b3f00'],['#0d3b2e','#145a32'],['#2c003e','#4a0072'],
  ['#003366','#004080'],['#1b1b2f','#2b2b4b'],['#002b36','#073642'],
  ['#1a1a00','#3d3d00'],['#0f2027','#203a43'],['#2e0024','#5e0048'],
];

function drawMockPhoto(cx, y, pw, ph, idx, shape, bw, bColor) {
  const x = cx - pw / 2;
  ctx.save();

  // Ramka (tashqarida)
  if (bw > 0) {
    ctx.strokeStyle = bColor;
    ctx.lineWidth   = bw;
    ctx.beginPath();
    drawPhotoClip(cx, y, pw, ph, shape);
    ctx.stroke();
  }

  // Clip
  ctx.beginPath();
  const inset = bw / 2;
  drawPhotoClipInset(cx, y, pw, ph, shape, inset);
  ctx.clip();

  // Gradient fon
  const [c1, c2] = PALETTE[idx % PALETTE.length];
  const g = ctx.createLinearGradient(x, y, x + pw * 0.4, y + ph);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  ctx.fillStyle = g;
  ctx.fillRect(x, y, pw, ph);

  // Placeholder avatar (bosh)
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.beginPath();
  ctx.arc(cx, y + ph * 0.33, pw * 0.24, 0, Math.PI*2);
  ctx.fill();
  // gavda
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  ctx.beginPath();
  ctx.ellipse(cx, y + ph * 0.88, pw * 0.36, ph * 0.30, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawPhotoClip(cx, y, pw, ph, shape) {
  const r = Math.min(pw, ph) * 0.13;
  switch(shape) {
    case 'circle': ctx.arc(cx, y + ph/2, Math.min(pw,ph)/2, 0, Math.PI*2); break;
    case 'oval':   ctx.ellipse(cx, y+ph/2, pw/2, ph/2, 0, 0, Math.PI*2); break;
    case 'rect':   ctx.rect(cx-pw/2, y, pw, ph); break;
    default:       ctx.roundRect(cx-pw/2, y, pw, ph, r);
  }
}
function drawPhotoClipInset(cx, y, pw, ph, shape, ins) {
  const r = Math.min(pw, ph) * 0.13;
  const x2 = cx - pw/2 + ins, y2 = y + ins;
  const w2 = pw - ins*2, h2 = ph - ins*2;
  switch(shape) {
    case 'circle': ctx.arc(cx, y+ph/2, Math.min(pw,ph)/2 - ins, 0, Math.PI*2); break;
    case 'oval':   ctx.ellipse(cx, y+ph/2, pw/2-ins, ph/2-ins, 0, 0, Math.PI*2); break;
    case 'rect':   ctx.rect(x2, y2, w2, h2); break;
    default:       ctx.roundRect(x2, y2, w2, h2, Math.max(1, r - ins));
  }
}

function hexRgba(hex, a) {
  const n = parseInt(hex.replace('#',''), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function sl(id, lblId, sfx, key, transform) {
  const el = document.getElementById(id);

  el.addEventListener('input', () => {

    redraw();
  });
}

function tg(groupId, key, onChange) {
  document.getElementById(groupId).querySelectorAll('.toggle-btn').forEach(btn => {
